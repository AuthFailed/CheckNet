name: CheckNet
options:
  bundleIdPrefix: com.chrsnv
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

packages:
  NetworkKit:
    path: Packages/NetworkKit

settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: ""

targets:
  CheckNet:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: NetworkKit
      - target: CheckNetWidgets
        embed: true
        platformFilter: iOS
      # Xray core for the "Xray inbound availability" tool (#71). Static xcframework
      # (libXray.a) — linked, not embedded. Fetch with Scripts/fetch-libxray.sh.
      - framework: Frameworks/LibXray.xcframework
        embed: false
      # The Go core resolves DNS via libresolv (res_9_ninit/nsearch/nclose).
      - sdk: libresolv.tbd
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CheckNet
        CFBundleDevelopmentRegion: en
        # Track the build settings so bumping CURRENT_PROJECT_VERSION / MARKETING_VERSION
        # actually changes the shipped version (XcodeGen otherwise writes literal defaults).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations:
          - ru
          - en
          - zh-Hans
          - es
          - fr
          - de
          - ja
          - pt-BR
          - ko
          - it
          - tr
          - ar
          - hi
        # All cryptography is standard, published algorithms via Apple frameworks
        # (TLS, plus config-link decoding: RSA/ChaCha20-Poly1305/AES-GCM). That
        # qualifies for the export exemption, so this is false. The annual
        # mass-market self-classification report to BIS/ENC (15 CFR 740.17) is a
        # separate obligation. See docs/appstore/export-compliance.md.
        ITSAppUsesNonExemptEncryption: false
        # Expose the app's Documents folder in Files ("On My iPhone/CheckNet") and
        # let it open documents in place — so users can open geosite/geoip .dat and
        # mihomo .mrs files, and get at exported lists.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # ip-api.com's key-less geolocation tier is HTTP-only. Scope a cleartext
        # exception to just that host — only a public IP is ever sent to it.
        NSAppTransportSecurity:
          NSExceptionDomains:
            ip-api.com:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        CFBundleURLTypes:
          - CFBundleURLName: com.chrsnv.checknet.deeplink
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - checknet
        NSSupportsLiveActivities: true
        # Handoff: the system only resumes activities of a declared type.
        NSUserActivityTypes:
          - com.chrsnv.checknet.tool
        # Background uptime monitoring (BGTaskScheduler app-refresh).
        BGTaskSchedulerPermittedIdentifiers:
          - com.chrsnv.checknet.monitor.refresh
        UIBackgroundModes:
          - fetch
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # iPhone: no upside-down (the platform norm). iPad: all four, which App
        # Store validation requires for multitasking (an iPad build missing
        # PortraitUpsideDown is rejected at ingest).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "The camera is used only to scan QR codes containing your list of saved hosts. Images are not sent anywhere."
        NSLocationWhenInUseUsageDescription: "Location access is used only to read the name of the current Wi-Fi network — iOS provides the SSID only with this permission. Coordinates are not used or sent anywhere."
        NSLocalNetworkUsageDescription: "CheckNet scans the local network to discover devices, Bonjour services, and check hosts."
        NSBonjourServices:
          - _services._dns-sd._udp
          - _checknet._tcp
          - _http._tcp
          - _https._tcp
          - _ssh._tcp
          - _sftp-ssh._tcp
          - _smb._tcp
          - _afpovertcp._tcp
          - _airplay._tcp
          - _raop._tcp
          - _googlecast._tcp
          - _ipp._tcp
          - _ipps._tcp
          - _printer._tcp
          - _homekit._tcp
          - _hap._tcp
          - _spotify-connect._tcp
          - _device-info._tcp
          - _companion-link._tcp
          - _rfb._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrsnv.checknet
        PRODUCT_NAME: CheckNet
        # App icon lives in App/Resources/Assets.xcassets/AppIcon.appiconset.
        # A single 1024×1024 (no alpha) drives every size on iOS 26. Until the
        # designed PNG lands the set has an empty slot (builds with a warning);
        # dropping icon-1024.png in clears it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # Extract Text("…") keys into Localizable.xcstrings on every build.
        # With this off the catalog silently drifted: new UI shipped with keys
        # that were never in the catalogue, so they could never be translated.
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: App/CheckNet.entitlements
        # macOS needs the sandbox + networking entitlements, which iOS neither
        # has nor accepts — hence a separate file per SDK.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/CheckNet-macOS.entitlements
    # The UI tests are deliberately absent here: they are iOS-only, and a scheme
    # that lists them cannot be tested against the macOS destination — xcodebuild
    # still builds every test target in the scheme, and an iOS bundle built with
    # the ad-hoc identity the Mac run passes is rejected outright by the iOS SDK.
    # They get their own scheme below.
    scheme:
      testTargets:
        - CheckNetTests

  # Logic tests for the code under Shared/. Those sources are compiled straight
  # into the bundle rather than linked from the app, so the tests need no host
  # application and run on both destinations.
  CheckNetTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/CheckNetTests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrsnv.checknet.tests
        PRODUCT_NAME: CheckNetTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES

  # UI tests exist for one reason: landscape size classes only change when a
  # device really rotates, which no unit test can do.
  CheckNetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CheckNetUITests
    dependencies:
      - target: CheckNet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrsnv.checknet.uitests
        PRODUCT_NAME: CheckNetUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: CheckNet

  CheckNetWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: CheckNet
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrsnv.checknet.widgets
        PRODUCT_NAME: CheckNetWidgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Widgets/CheckNetWidgets.entitlements

# A scheme of its own, so the app scheme stays testable on macOS while these
# iOS-only tests keep a simulator destination.
schemes:
  CheckNetUITests:
    build:
      targets:
        CheckNet: [test]
        CheckNetUITests: [test]
    test:
      targets:
        - CheckNetUITests
